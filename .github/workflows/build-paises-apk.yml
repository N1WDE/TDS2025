name: Compilar APK Android - Listado de Países

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Actividad4_ListadoPaises/**'
      - '.github/workflows/build-paises-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
      - name: Instalar Android SDK 36
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Compilar APK
        run: gradle --no-daemon -p Actividad4_ListadoPaises assembleDebug
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Listado-de-Paises-APK
          path: Actividad4_ListadoPaises/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
