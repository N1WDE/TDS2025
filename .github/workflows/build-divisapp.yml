name: Generar APK Android - DivisApp

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'conversor-de-divisas/**'
      - '.github/workflows/build-divisapp.yml'

permissions:
  contents: read

jobs:
  build-android:
    name: Compilar APK de DivisApp
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar paquetes del Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "No se encontró sdkmanager en $ANDROID_HOME"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Instalar dependencias
        working-directory: conversor-de-divisas
        run: npm install

      - name: Compilar Ionic
        working-directory: conversor-de-divisas
        run: npm run build

      - name: Crear y sincronizar plataforma Android
        working-directory: conversor-de-divisas
        run: |
          npx cap add android
          npx cap sync android

      - name: Generar APK de depuración
        working-directory: conversor-de-divisas/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publicar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: DivisApp-Android-APK
          path: conversor-de-divisas/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
